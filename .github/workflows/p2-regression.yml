name: P2 slow-sensor regression
on:
  push:
    paths: ['python/slow_sensor.py', 'tests/test_slow_sensor.py', '.github/workflows/p2-regression.yml']
  pull_request:
    paths: ['python/slow_sensor.py', 'tests/test_slow_sensor.py', '.github/workflows/p2-regression.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  slow-sensor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p test_slow_sensor.py -v
